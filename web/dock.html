<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参加者キュー (OBSドック)</title>
<link rel="stylesheet" href="/assets/panel.css"></head>
<body><div id="root"></div>
<script src="/assets/panel.js"></script>
<script>
  let ws, cb = () => {};
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', role: 'dock' }));
    ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'state') cb(m.state); };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();
  Panel.mount(document.getElementById('root'), {
    onState: (f) => { cb = f; },
    action: (a) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: 'action', action: a })),
  });
</script></body></html>
